<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coffee Orders Dashboard</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:#f5f1ec;color:#2b2118}
header{background:#3b2a1f;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
main{max-width:1000px;margin:auto;padding:16px}.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px #0002}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat b{font-size:1.5rem;display:block}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #eee;font-size:.9rem}
.tw{overflow-x:auto}button{background:#8b5a2b;color:#fff;border:0;border-radius:6px;padding:8px 12px;cursor:pointer}
button.sec{background:#ddd;color:#222}button.del{background:#b3261e}input,select,textarea{width:100%;padding:8px;margin:4px 0 10px;border:1px solid #ccc;border-radius:6px}
#login{max-width:340px;margin:60px auto}.hidden{display:none!important}.err{color:#b3261e;font-size:.9rem}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center}.modal .card{width:min(420px,92vw)}
.alert{background:#fff3cd;border-left:4px solid #e0a800;padding:6px 10px;margin:4px 0;font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
</style></head><body>
<div id="login" class="card"><h2>Login</h2>
<label>Username</label><input id="u" value="admin"><label>Password</label><input id="p" type="password" value="admin123">
<button onclick="login()">Masuk</button> <p id="lerr" class="err"></p></div>

<div id="app" class="hidden">
<header><b>☕ Coffee Orders Dashboard</b><span><span id="hs"></span> <button class="sec" onclick="logout()">Logout</button></span></header>
<main>
<div class="grid" id="stats"></div><br>
<div class="card"><div class="row"><h3>Menu (dari DB)</h3>
<span><button class="sec" onclick="sync()">Sync dari Sample API</button> <button onclick="openOrder()">+ Order Baru</button></span></div>
<div class="tw"><table><thead><tr><th>ID</th><th>Title</th><th>Ingredients</th><th>Harga</th></tr></thead><tbody id="coffees"></tbody></table></div></div>
<div class="card"><h3>Transaksi (Orders)</h3>
<div class="tw"><table><thead><tr><th>ID</th><th>Kopi</th><th>Qty</th><th>Total</th><th>Status</th><th>User</th><th></th></tr></thead><tbody id="orders"></tbody></table></div></div>
<div class="card"><div class="row"><h3>Alerts</h3><span><button class="sec" onclick="sim('error')">Simulasi 5xx (x4)</button> <button class="sec" onclick="sim('slow')">Simulasi Slow</button></span></div><div id="alerts"></div></div>
</main></div>

<div id="modal" class="modal hidden"><div class="card"><h3>Order Baru</h3>
<label>Kopi</label><select id="mc"></select><label>Qty</label><input id="mq" type="number" min="1" value="1">
<label>Catatan</label><textarea id="mn"></textarea><p id="merr" class="err"></p>
<button onclick="saveOrder()">Simpan</button> <button class="sec" onclick="closeM()">Batal</button></div></div>
<script>
let token=localStorage.getItem('token');
const $=id=>document.getElementById(id), rp=n=>'Rp '+Number(n).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path,opt={}){
  const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});
  if(r.status===401&&token){logout();throw new Error('Sesi habis');}
  if(r.status===204)return null;
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((d.error||'Error')+(d.details?': '+d.details.join(', '):''));
  return d;}
async function login(){
  try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('u').value,password:$('p').value})});
  token=d.token;localStorage.setItem('token',token);start();}catch(e){$('lerr').textContent=e.message;}}
function logout(){token=null;localStorage.removeItem('token');$('app').classList.add('hidden');$('login').classList.remove('hidden');}
async function start(){$('login').classList.add('hidden');$('app').classList.remove('hidden');await load();}
async function load(){
  try{
    const [c,o,s,a,h]=await Promise.all([api('/api/coffees'),api('/api/orders'),api('/api/summary'),api('/api/alerts'),fetch('/health').then(r=>r.json())]);
    $('hs').textContent='health: '+h.status+' ';
    $('stats').innerHTML=[['Menu',s.coffees],['Orders',s.orders],['Revenue',rp(s.revenue)]].map(x=>`<div class="card stat"><b>${x[1]}</b>${x[0]}</div>`).join('');
    $('coffees').innerHTML=c.map(x=>`<tr><td>${x.id}</td><td>${esc(x.title)}</td><td>${esc(x.ingredients.join(', '))}</td><td>${rp(x.price)}</td></tr>`).join('')||'<tr><td colspan=4>Kosong. Klik Sync.</td></tr>';
    $('mc').innerHTML=c.map(x=>`<option value="${x.id}">${esc(x.title)} - ${rp(x.price)}</option>`).join('');
    $('orders').innerHTML=o.map(x=>`<tr><td>${x.id}</td><td>${esc(x.coffee_title)}</td><td>${x.qty}</td><td>${rp(x.total)}</td>
      <td><select onchange="setStatus(${x.id},this.value)">${['pending','paid','done','cancelled'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td>
      <td>${esc(x.username)}</td><td><button class="del" onclick="delOrder(${x.id})">Hapus</button></td></tr>`).join('')||'<tr><td colspan=7>Belum ada order.</td></tr>';
    $('alerts').innerHTML=a.alerts.map(x=>`<div class="alert"><b>${esc(x.alert)}</b> ${esc(x.ts)}<br>${esc(x.detail)}</div>`).join('')||'<small>Tidak ada alert.</small>';
  }catch(e){console.error(e);}}
async function sync(){try{const d=await api('/api/sync',{method:'POST'});alert(`Sync ${d.count} item (sumber: ${d.source})`);load();}catch(e){alert(e.message);}}
function openOrder(){$('merr').textContent='';$('modal').classList.remove('hidden');}
function closeM(){$('modal').classList.add('hidden');}
async function saveOrder(){try{await api('/api/orders',{method:'POST',body:JSON.stringify({coffee_id:+$('mc').value,qty:+$('mq').value,note:$('mn').value})});closeM();load();}catch(e){$('merr').textContent=e.message;}}
async function setStatus(id,status){try{await api('/api/orders/'+id,{method:'PUT',body:JSON.stringify({status})});load();}catch(e){alert(e.message);}}
async function delOrder(id){if(confirm('Hapus order #'+id+'?')){await api('/api/orders/'+id,{method:'DELETE'});load();}}
async function sim(t){if(t==='error'){for(let i=0;i<4;i++)await fetch('/debug/error');}else{await fetch('/debug/slow');}setTimeout(load,300);}
if(token)start();
</script></body></html>
